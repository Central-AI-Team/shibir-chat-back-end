name: Eval nightly

# Retrieval + gate metrics on the held-out TEST split against a STAGING
# index, every night and on demand. Not on PRs: it calls OpenAI (the query
# rewrite) and the GPU service, and it needs the real index. It FAILS when
# recall@5 drops by more than 2 points or gate precision by more than 1 point
# against the last row of docs/eval-results.md (the recorded baseline), so a
# silent regression in retrieval or the gate shows up the next morning.
# Nothing here tunes a setting: it only produces and compares numbers.
#
# Secrets (repository settings; names only, documented in docs/evaluation.md):
#   OPENAI_API_KEY            query-rewrite / condensation calls
#   EVAL_GPU_SERVICE_URL      staging GPU service (embed + rerank), base URL
#   EVAL_GPU_API_KEY          its X-API-Key
#   EVAL_DATABASE_URL         staging Postgres (retriever reads book names)
#   EVAL_CHROMA_ARCHIVE_URL   where to fetch the staging chroma_db/ tarball
#                             (a pre-signed object-store URL)
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC nightly
  workflow_dispatch:
    inputs:
      questions:
        description: "question file (default: the held-out test split)"
        default: "scripts/eval/test.json"
        required: false

permissions:
  contents: read

concurrency:
  group: eval-nightly
  cancel-in-progress: false

env:
  RECALL_DROP_POINTS: "2"      # fail when recall@5 falls by more than this (percentage points)
  GATE_PRECISION_DROP_POINTS: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GPU_SERVICE_URL: ${{ secrets.EVAL_GPU_SERVICE_URL }}
      GPU_API_KEY: ${{ secrets.EVAL_GPU_API_KEY }}
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      HF_HUB_OFFLINE: "1"
      LANGFUSE_ENABLED: "false"
      QUESTIONS: ${{ github.event.inputs.questions || 'scripts/eval/test.json' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache uv package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked

      # The staging index is a copy of production's chroma_db/ (CLAUDE.md §9):
      # the same collection name, so settings need no change.
      - name: Fetch the staging index
        env:
          EVAL_CHROMA_ARCHIVE_URL: ${{ secrets.EVAL_CHROMA_ARCHIVE_URL }}
        run: |
          test -n "$EVAL_CHROMA_ARCHIVE_URL" || { echo "EVAL_CHROMA_ARCHIVE_URL is not set"; exit 1; }
          curl -sSfL "$EVAL_CHROMA_ARCHIVE_URL" -o chroma_db.tar.gz
          tar -xzf chroma_db.tar.gz
          test -d chroma_db

      - name: Validate the question file
        run: uv run python -m scripts.validate_eval_set "$QUESTIONS"

      - name: Run eval_retrieval on the test split
        run: uv run python -m scripts.eval_retrieval "$QUESTIONS" --k 1,3,5,10 --report eval_reports/nightly.json

      # Compares against the LAST row of docs/eval-results.md (the table's
      # recall@5 and gate-precision columns, "all" slice). A missing baseline
      # row records the numbers and passes.
      - name: Compare with the recorded baseline
        run: |
          uv run python - <<'PY'
          import json, os, re, sys
          rep = json.load(open("eval_reports/nightly.json", encoding="utf-8"))
          run = rep["runs"][0]
          recall5 = run["metrics"]["final"]["5"]["recall"] * 100
          fp = run["false_positives"]
          # gate precision over the whole set = true answers / all answers (same rule as
          # eval_retrieval._gate_counts and tune_threshold._metrics_at)
          t = fp["threshold"]
          cleared_ans = sum(1 for q in run["per_query"] if q["answerable"] and q["top_rerank_score"] is not None and q["top_rerank_score"] >= t)
          cleared_all = cleared_ans + fp["gated"]
          gate_prec = (cleared_ans / cleared_all * 100) if cleared_all else 100.0
          print(f"tonight: recall@5={recall5:.1f}  gate_precision={gate_prec:.1f}")
          rows = [l for l in open("docs/eval-results.md", encoding="utf-8") if l.startswith("|") and "| all |" in l]
          if not rows:
              print("no baseline row for slice 'all' in docs/eval-results.md: recording only"); sys.exit(0)
          cells = [c.strip() for c in rows[-1].strip().strip("|").split("|")]
          # columns: date | commit | eval-set version | slice | recall@5 | MRR | gate precision | gate recall | notes
          base_recall, base_prec = float(cells[4]), float(cells[6])
          print(f"baseline ({cells[0]} {cells[1]}): recall@5={base_recall:.1f}  gate_precision={base_prec:.1f}")
          bad = []
          if base_recall - recall5 > float(os.environ["RECALL_DROP_POINTS"]):
              bad.append(f"recall@5 dropped {base_recall - recall5:.1f} points")
          if base_prec - gate_prec > float(os.environ["GATE_PRECISION_DROP_POINTS"]):
              bad.append(f"gate precision dropped {base_prec - gate_prec:.1f} points")
          if bad:
              print("REGRESSION: " + "; ".join(bad)); sys.exit(1)
          print("within tolerance")
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-${{ github.run_id }}
          path: eval_reports/nightly.json
