# Version updates go to dev, like any feature PR (CONTRIBUTING.md).
# NOTE: Dependabot *security* updates ignore target-branch and always open
# against the default branch (main).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # One PR for all Python updates instead of one per package.
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
