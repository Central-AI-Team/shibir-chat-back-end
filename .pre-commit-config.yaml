# Install once with `uvx pre-commit install` (see CONTRIBUTING.md).
# Keep the ruff and gitleaks versions in sync with .github/workflows/ci.yml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check  # rules come from ruff.toml (bug-class only)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: detect-private-key
