[project]
name = "shibir-chat-back-end"
version = "0.1.0"
description = "FastAPI back-end for Shibir Chat, a Bengali-language RAG Q&A service"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.11.0",
    "attrs==26.1.0",
    "backoff==2.2.1",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "build==1.6.1",
    "cachetools==6.2.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "chromadb==1.5.9",
    "click==8.5.0",
    "coloredlogs==15.0.1",
    "distro==1.9.0",
    "durationpy==0.11",
    "fastapi==0.122.0",
    "filelock==4.0.8",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "google-auth==2.59.1",
    "googleapis-common-protos==1.72.0",
    "greenlet==3.5.6",
    "grpcio==1.84.0",
