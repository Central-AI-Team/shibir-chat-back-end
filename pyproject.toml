    "six==1.17.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.36",
    "starlette==0.50.0",
    "sympy==1.14.0",
    "tenacity==9.1.4",
    "threadpoolctl==3.7.0",
    "tokenizers==0.22.2",
    "torch==2.9.1",
    "tqdm==4.70.1",
    "transformers==4.56.2",
    "typer==0.27.2",
    "typer-slim==0.24.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0; sys_platform != 'win32'",
    "watchfiles==1.3.0",
    "websocket-client==1.9.2",
    "websockets==17.1",
    "wrapt==2.5.0", # langfuse.openai uses wrapt to wrap the OpenAI SDK
    "zipp==4.1.0",
    # --- GPU/CUDA acceleration (Linux/Windows with an NVIDIA GPU) ---
    # Not required to run this app -- torch and triton pull in the correct
    # platform-specific build automatically (or none at all, on macOS, which has
    # no CUDA support). Pinned here only to match what was tested; remove or
    # leave unpinned if you hit a resolution conflict on your platform.
    "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-cupti-cu12==12.8.90; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.8.93; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.8.90; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.3.3.83; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cufile-cu12==1.13.1.3; sys_platform == 'linux'",
    "nvidia-curand-cu12==10.3.9.90; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusolver-cu12==11.7.3.90; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusparse-cu12==12.5.8.93; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusparselt-cu12==0.7.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nccl-cu12==2.27.5; sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12==12.8.93; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nvshmem-cu12==3.3.20; sys_platform == 'linux'",
    "nvidia-nvtx-cu12==12.8.90; sys_platform == 'linux' or sys_platform == 'win32'",
    "triton==3.5.1; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Without this, `uv run pytest` (the bare console-script entry point) can't
# import `app` -- unlike `python -m pytest`, it doesn't put the repo root on
# sys.path itself.
pythonpath = ["."]
