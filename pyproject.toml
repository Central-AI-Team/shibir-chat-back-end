[project]
name = "shibir-chat-back-end"
version = "0.1.0"
description = "FastAPI back-end for Shibir Chat, a Bengali-language RAG Q&A service"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.14.2",
    "attrs==25.4.0",
    "backoff==2.2.1",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.14.2",
    "build==1.3.0",
    "cachetools==6.2.2",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "chromadb==1.3.5",
    "click==8.3.1",
    "coloredlogs==15.0.1",
    "distro==1.9.0",
    "durationpy==0.10",
    "fastapi==0.141.1",
    "filelock==3.20.3",
    "flatbuffers==25.9.23",
    "fsspec==2025.10.0",
    "google-auth==2.43.0",
    "googleapis-common-protos==1.72.0",
    "greenlet==3.2.4",
    "grpcio==1.76.0",
    "h11==0.16.0",
    "hf-xet==1.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.5.0",
    "humanfriendly==10.0",
    "idna==3.15",
    "importlib_metadata==8.7.0",
    "importlib_resources==6.5.2",
    "Jinja2==3.1.6",
    "jiter==0.12.0",
    "joblib==1.5.2",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "kubernetes==35.0.0",
    # LLM tracing / observability. Isolated to app/core/tracing.py + the wiring
    # in app/core/llm.py; opt-in via LANGFUSE_* env (disabled by default).
    # v4, the OpenTelemetry-based API (manual observation objects via
    # start_observation()/start_as_current_observation(), no more trace()/
    # span()/generation()) -- migrated 2026-09-19 because Langfuse Cloud
    # dropped this project's org onto the v4 backend, which sunsets the v2
    # SDK's legacy ingestion path entirely on 2026-11-16. See
    # app/core/tracing.py's module docstring before changing this further.
    "langfuse==4.15.4",
    "markdown-it-py==4.0.0",
    "MarkupSafe==3.0.3",
    "mdurl==0.1.2",
    "mmh3==5.2.0",
    "mpmath==1.3.0",
    "networkx==3.6",
    "numpy==2.3.5",
    "oauthlib==3.3.1",
    "onnxruntime==1.23.2",
    "openai==2.8.1",
    "opentelemetry-api==1.38.0",
    "opentelemetry-exporter-otlp-proto-common==1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.38.0",
    "opentelemetry-proto==1.38.0",
    "opentelemetry-sdk==1.38.0",
    "opentelemetry-semantic-conventions==0.59b0",
    "orjson==3.11.6",
    "overrides==7.7.0",
    # NOTE: pinned <25.0, not the 25.0 that requirements.txt had -- a
    # pre-existing requirements.txt bug uv's resolver caught (the real venv/
    # here has 24.2, not 25.0). langfuse==4.15.4 itself only needs
    # packaging<27.0 (looser than the old 2.60.10 pin's <25.0), so this stays
    # pinned at 24.2 for continuity, not because anything still requires it.
    "packaging==24.2",
    "pillow==12.3.0",
    "posthog==5.4.0",
    "protobuf==6.33.5",
    "psycopg2-binary==2.9.10",
    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pybase64==1.4.2",
    "pydantic==2.12.4",
    "pydantic-settings==2.14.2",
    "pydantic_core==2.41.5",
    "Pygments==2.20.0",
    "PyPika==0.48.9",
    "pyproject_hooks==1.2.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "regex==2025.11.3",
    "requests==2.33.0",
    "requests-oauthlib==2.0.0",
    "rich==14.2.0",
    "rpds-py==0.29.0",
    "rsa==4.9.1",
    "safetensors==0.8.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "sentence-transformers==6.1.0",
    "setuptools==83.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.36",
    "starlette==1.3.1",
    "sympy==1.14.0",
    "tenacity==9.1.2",
    "threadpoolctl==3.6.0",
    "tokenizers==0.23.2",
    "torch==2.14.0",
    "tqdm==4.67.1",
    "transformers==5.17.0",
    "typer==0.20.0",
    "typer-slim==0.20.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
    "uvicorn==0.38.0",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "watchfiles==1.1.1",
    "websocket-client==1.9.0",
    "websockets==15.0.1",
    "wrapt==1.17.3", # langfuse.openai uses wrapt to wrap the OpenAI SDK
    "zipp==3.23.0",
    "rank-bm25==0.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Without this, `uv run pytest` (the bare console-script entry point) can't
# import `app` -- unlike `python -m pytest`, it doesn't put the repo root on
# sys.path itself.
pythonpath = ["."]
