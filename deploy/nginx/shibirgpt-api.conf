# nginx reverse proxy for the Shibir Chat API: the ONLY public entry point.
# The app container publishes 127.0.0.1:9200 (docker-compose.yml), so nothing
# else can reach it from outside.
#
# Install:
#   sudo cp deploy/nginx/shibirgpt-api.conf /etc/nginx/conf.d/shibirgpt-api.conf
#   sudo certbot certonly --nginx -d askshibir-back.potropollob.com   # first time
#   sudo nginx -t && sudo systemctl reload nginx
# (conf.d files are included inside the http {} block, which limit_req_zone needs.)

# 30 requests/minute per client IP, shared by /chat and /chat/stream.
limit_req_zone $binary_remote_addr zone=shibir_chat:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name askshibir-back.potropollob.com;

    # Let's Encrypt HTTP-01 renewals via `certbot --webroot` would go here;
    # the nginx plugin (above) handles it on its own.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name askshibir-back.potropollob.com;

    # TODO: placeholders in Let's Encrypt layout; certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/askshibir-back.potropollob.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askshibir-back.potropollob.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Chat messages are short; reject anything bigger before it reaches Python.
    client_max_body_size 64k;

    # Second layer: the app already serves no docs unless ENABLE_DOCS=true.
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # Server-Sent Events: no buffering, long read timeout (LLM can pause).
    location = /chat/stream {
        limit_req zone=shibir_chat burst=5 nodelay;

        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: nothing sits in front of
        # this proxy, so a client-supplied X-Forwarded-For must not be passed on.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /chat {
        limit_req zone=shibir_chat burst=5 nodelay;

        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: nothing sits in front of
        # this proxy, so a client-supplied X-Forwarded-For must not be passed on.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: nothing sits in front of
        # this proxy, so a client-supplied X-Forwarded-For must not be passed on.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
