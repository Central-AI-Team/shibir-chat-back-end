services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shibir_chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
     context: .
     network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/shibir_chat
      HOST: 0.0.0.0
      PORT: 9200
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 8000 to match CONTRIBUTING.md's documented native run (plain
      # `uvicorn app.main:app --reload`, no --port -- uvicorn defaults to
      # 8000) and the frontend's .env.example. The container's own uvicorn
      # still listens on 9200 (hardcoded in the Dockerfile's CMD).
      - "8000:9200"
    volumes:
      # Bind mount, not a named volume: `make ingest` still runs natively on
      # the host (see Makefile) and writes to this same ./chroma_db -- a
      # named volume would silently fork into a second, empty vector store
      # invisible to this container.
      - ./chroma_db:/app/chroma_db
      - hf_cache:/app/.cache/huggingface
      - ./data:/app/data

volumes:
  pgdata:
  hf_cache:
